name: Python Hello World on Windows Runner

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  run-python-app:
    # Mengarahkan pipeline ke self-hosted runner Windows Anda
    runs-on: [ self-hosted, windows ]

    steps:
      # 1. Download kode ke folder _work milik runner
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Verifikasi instalasi Python di server Windows
      - name: Check Python Version
        shell: powershell
        run: |
          python --version
          pip --version

      # 3. Install dependensi
      - name: Install Dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Jalankan Unit Test (CI)
      - name: Run Unit Tests
        shell: powershell
        run: |
          python -m unittest test_main.py -v

      # 5. Jalankan Aplikasi Utama
      - name: Run Application
        shell: powershell
        run: |
          python main.py